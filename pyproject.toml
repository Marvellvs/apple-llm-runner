[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm"
description = "Local LLM server for macOS (Apple Silicon) powered by MLX with an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "huggingface_hub>=0.23",
    "mlx",
    "mlx-lm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "local_llm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
